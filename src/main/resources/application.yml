spring:
  application:
    name: ms-andesstay-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK/NACK explicitos en cada listener (ver paquete messaging.listener)
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: true

logging:
  level:
    com.andesstay: INFO
